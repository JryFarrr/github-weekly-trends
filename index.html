<style>
  :root {
    --bg: #0a0a0a;
    --ink: #ffffffeb;
    --ink-2: #ffffffb3;
    --muted: #ffffff8c;
    --faint: #ffffff59;
    --line: #ffffff1a;
    --surface: #ffffff0a;
    --accent: #3fb950;
    --gold: #d29922;
    --mono: ui-monospace, "SF Mono", SFMono-Regular, Menlo, Consolas, monospace;
    --sans: -apple-system, BlinkMacSystemFont, "Segoe UI", system-ui, sans-serif;
  }

  body {
    background: var(--bg);
    color: var(--ink-2);
    font-family: var(--sans);
    line-height: 1.6;
    margin: 0;
  }
  @media (prefers-reduced-motion: no-preference) {
    html { scroll-behavior: smooth; }
  }

  /* ---------- Hero ---------- */
  .hero {
    position: relative;
    min-height: 100svh;
    display: flex;
    align-items: center;
    justify-content: center;
    overflow: hidden;
  }
  #graph {
    position: absolute;
    inset: 0;
    width: 100%;
    height: 100%;
    display: block;
  }
  .hero-fade {
    position: absolute;
    left: 0; right: 0; bottom: 0;
    height: 45%;
    background: linear-gradient(#0a0a0a00 0%, #0a0a0ad9 55%, #0a0a0a 100%);
    pointer-events: none;
  }
  .hero-copy {
    position: relative;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 1.1rem;
    text-align: center;
    padding: 1.5rem;
  }
  .eyebrow {
    font-family: var(--mono);
    font-size: 11px;
    letter-spacing: 0.18em;
    text-transform: uppercase;
    color: var(--accent);
    margin: 0;
  }
  h1 {
    font-family: var(--mono);
    font-size: max(44px, min(9vw, 110px));
    letter-spacing: -0.03em;
    line-height: 0.95;
    color: var(--ink);
    margin: 0;
    text-wrap: balance;
  }
  .hero-sub {
    font-family: var(--mono);
    font-size: 13px;
    letter-spacing: 0.04em;
    text-transform: uppercase;
    color: var(--muted);
    margin: 0;
  }
  .hero-actions {
    display: flex;
    flex-wrap: wrap;
    justify-content: center;
    align-items: center;
    gap: 0.75rem;
    margin-top: 0.5rem;
  }
  select {
    font-family: var(--mono);
    font-size: 13px;
    color: var(--ink);
    background: #ffffff0f;
    border: 1px solid #ffffff24;
    border-radius: 999px;
    padding: 0.55rem 1rem;
  }
  select option { background: #16181c; color: #ffffffeb; }
  .cta {
    font-family: var(--mono);
    font-size: 13px;
    color: #0a0a0a;
    background: var(--ink);
    border-radius: 999px;
    padding: 0.55rem 1.15rem;
    text-decoration: none;
  }
  .cta:hover { background: #ffffff; }

  /* ---------- Laporan ---------- */
  .wrap { max-width: 46rem; margin: 0 auto; padding: 3rem 1.25rem 4rem; }

  .lede {
    font-size: 1.05rem;
    line-height: 1.7;
    color: var(--ink-2);
    max-width: 65ch;
    margin: 0;
  }
  .chips {
    display: flex;
    flex-wrap: wrap;
    gap: 0.5rem;
    margin: 1.75rem 0 1.25rem;
  }
  .chips button {
    font-family: var(--mono);
    font-size: 12px;
    color: var(--muted);
    background: var(--surface);
    border: 1px solid var(--line);
    border-radius: 999px;
    padding: 0.35rem 0.9rem;
    cursor: pointer;
  }
  .chips button[aria-pressed="true"] {
    color: #0a0a0a;
    background: var(--ink);
    border-color: transparent;
  }

  .cards { display: flex; flex-direction: column; gap: 0.75rem; }
  details.card {
    background: var(--surface);
    border: 1px solid var(--line);
    border-radius: 10px;
  }
  details.card[open] { border-color: #3fb9508c; }
  summary {
    display: flex;
    flex-wrap: wrap;
    align-items: baseline;
    gap: 0.35rem 0.75rem;
    padding: 0.9rem 1rem;
    cursor: pointer;
    list-style: none;
  }
  summary::-webkit-details-marker { display: none; }
  summary:focus-visible, .chips button:focus-visible, select:focus-visible,
  a:focus-visible {
    outline: 2px solid var(--accent);
    outline-offset: 2px;
  }
  .rank { font-family: var(--mono); font-size: 0.8rem; color: var(--faint); min-width: 1.6rem; }
  .repo { font-family: var(--mono); font-size: 0.95rem; font-weight: 600; color: var(--ink); word-break: break-all; }
  .repo .owner { font-weight: 400; color: var(--muted); }
  .lang { font-size: 0.78rem; color: var(--muted); white-space: nowrap; }
  .dot {
    display: inline-block;
    width: 0.6em; height: 0.6em;
    border-radius: 50%;
    background: var(--muted);
    margin-right: 0.3em;
  }
  .badge {
    font-family: var(--mono);
    font-size: 10px;
    letter-spacing: 0.06em;
    color: var(--muted);
    border: 1px solid var(--line);
    border-radius: 999px;
    padding: 0.05rem 0.5rem;
    white-space: nowrap;
  }
  .badge-new { color: var(--accent); border-color: #3fb9508c; }
  .stars {
    font-family: var(--mono);
    font-variant-numeric: tabular-nums;
    font-size: 0.85rem;
    color: var(--gold);
    margin-left: auto;
    white-space: nowrap;
  }

  .body {
    border-top: 1px solid var(--line);
    padding: 1rem;
    display: flex;
    flex-direction: column;
    gap: 0.9rem;
  }
  .desc { color: var(--muted); font-style: italic; margin: 0; max-width: 65ch; }
  .blok h3 {
    font-family: var(--mono);
    font-size: 11px;
    letter-spacing: 0.14em;
    text-transform: uppercase;
    color: var(--accent);
    margin: 0 0 0.2rem;
  }
  .blok p { margin: 0; max-width: 65ch; color: var(--ink-2); }
  .meta {
    display: flex;
    flex-wrap: wrap;
    gap: 1rem;
    align-items: baseline;
    font-family: var(--mono);
    font-size: 0.78rem;
    color: var(--faint);
  }
  .meta a { color: var(--accent); text-decoration: none; }
  .meta a:hover { text-decoration: underline; }

  footer {
    margin-top: 3rem;
    border-top: 1px solid var(--line);
    padding-top: 1rem;
    font-family: var(--mono);
    font-size: 11px;
    letter-spacing: 0.04em;
    color: var(--faint);
  }
  @media (prefers-reduced-motion: no-preference) {
    details.card { transition: border-color 120ms ease; }
  }
</style>

<script>
  const DATA = JSON.parse(document.getElementById("data").textContent);
  const LANG_COLORS = {
    Python: "#3572a5", TypeScript: "#3178c6", JavaScript: "#f1e05a",
    Rust: "#dea584", Go: "#00add8", "C#": "#178600", "C++": "#f34b7d",
    Java: "#b07219", Ruby: "#701516", PHP: "#4f5d95", Swift: "#f05138",
    Kotlin: "#a97bff", C: "#555555", Shell: "#89e051", HTML: "#e34c26"
  };
  const fmt = n => n.toLocaleString("id-ID");
  const esc = s => String(s).replace(/[&<>"]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));

  let edIdx = 0, langFilter = "*";

  const selEl = document.getElementById("edisi");
  DATA.editions.forEach((ed, i) => {
    const o = document.createElement("option");
    o.value = i;
    o.textContent = ed.label;
    selEl.appendChild(o);
  });
  selEl.addEventListener("change", () => { edIdx = +selEl.value; langFilter = "*"; render(); });

  function render() {
    const ed = DATA.editions[edIdx];
    document.getElementById("hero-sub").textContent = "Edisi " + ed.label;
    document.getElementById("ringkasan").textContent = ed.summary;

    /* konteks antar-minggu: bandingkan dengan edisi sebelumnya di arsip */
    const prev = DATA.editions[edIdx + 1];
    const prevRank = prev ? Object.fromEntries(prev.repos.map((r, j) => [r.name, j])) : null;
    const streak = name => {
      let n = 1;
      for (let j = edIdx + 1; j < DATA.editions.length &&
           DATA.editions[j].repos.some(r => r.name === name); j++) n++;
      return n;
    };
    const badge = (name, i) => {
      if (!prevRank) return ""; /* edisi tertua: tak ada pembanding */
      if (!(name in prevRank)) return '<span class="badge badge-new">BARU</span>';
      const d = prevRank[name] - i;
      const arr = d > 0 ? " ▲" + d : d < 0 ? " ▼" + (-d) : "";
      return `<span class="badge">${streak(name)} mgg${arr}</span>`;
    };

    const langs = [...new Set(ed.repos.map(r => r.lang))];
    document.getElementById("filter").innerHTML =
      [`<button aria-pressed="${langFilter === "*"}" data-lang="*">Semua (${ed.repos.length})</button>`]
        .concat(langs.map(l => {
          const n = ed.repos.filter(r => r.lang === l).length;
          return `<button aria-pressed="${langFilter === l}" data-lang="${esc(l)}">${esc(l)} (${n})</button>`;
        })).join("");

    document.getElementById("cards").innerHTML = ed.repos
      .map((r, i) => ({ r, i }))
      .filter(({ r }) => langFilter === "*" || r.lang === langFilter)
      .map(({ r, i }) => {
        const [owner, repo] = r.name.split("/");
        const dot = LANG_COLORS[r.lang] || "var(--muted)";
        return `<details class="card">
          <summary>
            <span class="rank">#${i + 1}</span>
            <span class="repo"><span class="owner">${esc(owner)}/</span>${esc(repo)}</span>
            <span class="lang"><span class="dot" style="background:${dot}"></span>${esc(r.lang)}</span>
            ${badge(r.name, i)}
            <span class="stars">+${fmt(r.stars_week)} ★ minggu ini</span>
          </summary>
          <div class="body">
            <p class="desc">${esc(r.desc)}</p>
            <div class="blok"><h3>Apa ini</h3><p>${esc(r.apa)}</p></div>
            <div class="blok"><h3>Use case</h3><p>${esc(r.use_case)}</p></div>
            <div class="blok"><h3>Kenapa viral</h3><p>${esc(r.kenapa_viral)}</p></div>
            <div class="meta">
              <span>★ total ${fmt(r.stars_total)}</span>
              <a href="${esc(r.url)}" target="_blank" rel="noopener">Buka repo ↗</a>
            </div>
          </div>
        </details>`;
      }).join("");
  }

  document.getElementById("filter").addEventListener("click", e => {
    const b = e.target.closest("button");
    if (!b) return;
    langFilter = b.dataset.lang;
    render();
  });

  render();

  /* ---------- Contribution-graph hidup ---------- */
  const cv = document.getElementById("graph"), ctx = cv.getContext("2d");
  const RAMP = ["#0e4429", "#006d32", "#26a641", "#39d353"];
  const reduced = matchMedia("(prefers-reduced-motion: reduce)").matches;
  const CELL = 15; /* 12px kotak + 3px celah */
  let cells = [], stars = [], W = 0, H = 0, running = true, last = 0;

  function resize() {
    const dpr = devicePixelRatio || 1, r = cv.parentElement.getBoundingClientRect();
    W = r.width; H = r.height;
    cv.width = W * dpr; cv.height = H * dpr;
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    cells = [];
    for (let y = 0; y < H / CELL; y++)
      for (let x = 0; x < W / CELL; x++)
        cells.push({ x, y, base: Math.random() });
  }

  function draw(t) {
    if (!reduced) {
      if (!running) return;
      if (t - last < 33) { requestAnimationFrame(draw); return; } /* ~30fps cukup */
      last = t;
    }
    ctx.clearRect(0, 0, W, H);
    for (const c of cells) {
      const wave = reduced ? 0.4 : 0.5 + 0.5 * Math.sin(t / 4000 + c.x * 0.25 + c.y * 0.18 + c.base * 3);
      const v = c.base * 0.45 + wave * 0.55;
      if (v < 0.35) continue;
      ctx.globalAlpha = 0.06 + (v - 0.35) * 0.5;
      ctx.fillStyle = RAMP[Math.min(3, ((v - 0.35) / 0.1625) | 0)];
      ctx.fillRect(c.x * CELL, c.y * CELL, CELL - 3, CELL - 3);
    }
    ctx.globalAlpha = 1;
    if (reduced) return;

    if (stars.length < 12 && Math.random() < 0.02)
      stars.push({ x: 20 + Math.random() * (W - 40), y: H + 10, s: 8 + Math.random() * 8, v: 0.25 + Math.random() * 0.4, p: Math.random() * 6 });
    ctx.fillStyle = "#d29922";
    ctx.textAlign = "center";
    stars = stars.filter(st => st.y > -20);
    for (const st of stars) {
      st.y -= st.v; st.p += 0.01;
      const rise = Math.min(0.7, (H - st.y) / H);
      const top = Math.min(1, Math.max(0, st.y / 100));
      ctx.globalAlpha = Math.max(0, rise * top * (0.55 + 0.35 * Math.sin(st.p * 4)));
      ctx.font = st.s + "px " + '"SF Mono", ui-monospace, monospace';
      ctx.fillText("★", st.x + Math.sin(st.p) * 8, st.y);
    }
    ctx.globalAlpha = 1;
    requestAnimationFrame(draw);
  }

  /* hemat CPU: berhenti menggambar saat hero tak terlihat */
  new IntersectionObserver(([e]) => {
    const was = running;
    running = e.isIntersecting;
    if (!reduced && running && !was) requestAnimationFrame(draw);
  }).observe(cv);

  addEventListener("resize", () => { resize(); if (reduced) draw(0); });
  resize();
  reduced ? draw(0) : requestAnimationFrame(draw);
</script>
